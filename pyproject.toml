[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecourts-research-toolkit"
version = "1.0.0"
description = "Provenance-first collection and screening of public Indian court records for cybercrime and digital-forensics research."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Hamzah"}]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "click>=8.1,<9",
  "pypdf>=5,<7",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9",
]

[project.scripts]
ecourts-research = "ecourts_research.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
